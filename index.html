<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Survival</title><link rel="stylesheet" href="./styles.css"></head>
<body><main id="app"><header><div><h1>Session Survival</h1><p class="subtitle">A deterministic turn-based survival run</p></div><button id="debug" class="ghost">Debug</button></header>
<section id="between" class="panel"><h2>Between Runs</h2><p>Gold: <strong id="bank-gold">0</strong></p><div id="shop" class="shop"></div><button id="start" class="primary">Start New Run</button><label class="seed">Seed <input id="seed" type="number" value="12345"></label></section>
<section id="run" hidden><div class="game-layout"><div class="board-wrap"><svg id="board" aria-label="31 by 31 game board"></svg></div><aside class="hud panel"><div class="stats"><span>HP <b id="hp"></b></span><span>Level <b id="level"></b></span><span>XP <b id="xp"></b></span><span>Turn <b id="turn"></b></span><span>Run gold <b id="run-gold"></b></span></div><p id="facing"></p><button id="exit" class="ghost">Exit Run</button><p class="help">WASD / arrows move<br>Shift + direction face without moving<br>Space waits</p><div id="debug-info" class="debug-info"></div></aside></div>
<div class="controls"><button data-action="move:north">▲<small>North</small></button><button id="face-toggle">Change facing</button><button data-action="wait">Wait</button><button data-action="move:south">▼<small>South</small></button><button data-action="move:west">◀<small>West</small></button><button data-action="move:east">▶<small>East</small></button></div><div id="face-controls" class="face-controls" hidden><span>Face without moving:</span><button data-face="north">North</button><button data-face="south">South</button><button data-face="west">West</button><button data-face="east">East</button></div></section>
<div id="modal" class="modal" hidden><div class="panel modal-card"><h2 id="modal-title"></h2><p id="modal-text"></p><div id="modal-actions"></div></div></div></main><script type="module" src="./src/main.js"></script></body></html>
